name: Firebase Test Lab (manual)

on:
  workflow_dispatch:

jobs:
  test-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Write secrets.properties
        run: |
          cat > secrets.properties <<'EOF'
          INGEST_ENDPOINT=${{ secrets.INGEST_ENDPOINT || 'https://example.invalid/ingest-health' }}
          INGEST_SECRET=${{ secrets.INGEST_SECRET || 'dummy' }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'dummy' }}
          EOF

      - name: Build debug APK + androidTest APK
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Run Firebase Test Lab
        run: |
          gcloud firebase test android run \
            --type instrumentation \
            --app app/build/outputs/apk/debug/app-debug.apk \
            --test app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=oriole,version=33,locale=ko_KR,orientation=portrait \
            --timeout 10m
