name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create CI secrets.properties
        run: |
          cat > secrets.properties <<'EOF'
          INGEST_ENDPOINT=${{ secrets.INGEST_ENDPOINT || 'https://example.invalid/ingest-health' }}
          INGEST_SECRET=${{ secrets.INGEST_SECRET || 'dummy' }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'dummy' }}
          EOF

      - name: Build debug + release
        run: |
          ./gradlew assembleDebug
          ./gradlew assembleRelease -x lint -x lintVitalRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-artifacts
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Send release APK to Discord webhook
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is empty. skip upload."
            exit 0
          fi
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          MSG="자동 빌드 완료: ${GITHUB_REPOSITORY} #${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          curl -sS -X POST "$DISCORD_WEBHOOK_URL" \
            -F "payload_json={\"content\":\"$MSG\"}" \
            -F "file1=@${APK}"

  emulator-smoke:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create CI secrets.properties
        run: |
          cat > secrets.properties <<'EOF'
          INGEST_ENDPOINT=https://example.invalid/ingest-health
          INGEST_SECRET=dummy
          SUPABASE_ANON_KEY=dummy
          EOF

      - name: Run instrumentation smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: ./gradlew connectedDebugAndroidTest
